name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test + engine-purity
    runs-on: ubuntu-latest
    # Ubuntu's GTK trails GNOME: 24.04 ships 4.14, and glycin's gdk4 support
    # needs >= 4.16, so every push after 0.2.0 failed at gdk4-sys. Fedora
    # tracks the GNOME 50 platform the Flatpak ships on.
    container: registry.fedoraproject.org/fedora:44
    steps:
      # git first: actions/checkout falls back to a tarball without it, and
      # `cargo tree` and friends are happier inside a real work tree.
      - name: Install GTK4 / libadwaita / blueprint
        run: |
          dnf -y install gcc pkgconf-pkg-config git gtk4-devel libadwaita-devel \
            blueprint-compiler gettext-devel rustup

      - uses: actions/checkout@v4

      # Pinned, not `stable`: a new clippy lint on a toolchain nobody develops
      # with should not turn CI red overnight. Bump this deliberately, together
      # with the local toolchain.
      - name: Rust toolchain
        run: |
          rustup-init -y --profile minimal --default-toolchain 1.94.0 -c rustfmt -c clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all

      # PLAN §1 house rule 2 + §0 task 6: the engine crate must stay UI-free.
      - name: Engine purity
        run: |
          if cargo tree -p vitrine-engine -e normal \
              | grep -Ei '\b(gtk4|glib|gio|libadwaita|adw|ashpd)\b'; then
            echo "::error::vitrine-engine has a forbidden UI dependency"
            exit 1
          fi
          echo "engine is UI-free"
